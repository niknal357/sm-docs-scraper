<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title} | SM Docs</title>
  <link rel="icon" href="data:,">
  {pagefind_meta}
  <script>{theme_script}</script>
  <link rel="stylesheet" href="{stylesheet}">
</head>
<body>
  <header class="navbar">
    <button class="menu-button" id="menu-button" aria-label="Toggle navigation">☰</button>
    <a class="brand" href="{home}"><span class="brand-mark">SM</span><span>SM Docs</span></a>
    <div class="navbar-spacer"></div>
    <button class="theme-button" id="theme-button" type="button" aria-label="Toggle color theme"><svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg></button>
    <div class="navbar-search" id="navbar-search" data-symbol-index="{symbol_index}" data-pagefind-module="{pagefind_module}" data-site-home="{home}" data-current-environment="{current_environment}">
      <div class="search-bar">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
        <label class="visually-hidden" for="site-search-input">Search documentation</label>
        <input id="site-search-input" type="search" role="combobox" aria-autocomplete="list" aria-controls="search-popover-results" aria-expanded="false" aria-keyshortcuts="Control+K Meta+K /" autocomplete="off" spellcheck="false" placeholder="Search docs">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="search-popover" id="search-popover" hidden>
        <p class="search-popover-status" id="search-popover-status" aria-live="polite"></p>
        <div class="search-popover-results" id="search-popover-results" role="listbox" aria-label="Search suggestions"></div>
        <a class="search-see-all" id="search-see-all" href="{home}">See all results</a>
      </div>
    </div>
  </header>
  <div class="page-layout">
    <aside class="sidebar" id="sidebar"><nav>{sidebar}</nav></aside>
    <div class="content-layout{toc_class}">
      <main class="doc">
        <div class="breadcrumbs">{breadcrumbs}</div>
        <article class="doc-content{article_class}"{pagefind_attributes}>
          {body}
        </article>
      </main>
      {toc}
    </div>
  </div>
  <script src="{minisearch_script}"></script>
  <script src="{search_core_script}"></script>
  <script src="{site_script}"></script>
  <script src="{search_script}"></script>
</body>
</html>
