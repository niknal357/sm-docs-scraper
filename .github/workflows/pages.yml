name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.source_check.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.21
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download API source
        run: uv run python download_docs.py --destination temp

      - name: Check API source
        id: source_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            uv run python check_api_source.py \
              --source-root temp \
              --site-url "$SITE_URL" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.source_check.outputs.changed == 'true'
        run: uv run python -m unittest discover -s tests

      - name: Build site
        if: steps.source_check.outputs.changed == 'true'
        run: uv run python main.py --source-root temp
        env:
          SM_DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Check search quality
        if: steps.source_check.outputs.changed == 'true'
        run: node tests/search_quality.js

      - name: Upload GitHub Pages artifact
        if: steps.source_check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/html

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
